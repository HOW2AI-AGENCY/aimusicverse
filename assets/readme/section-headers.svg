<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="100%">
  <defs>
    <style>
      .num { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 10px; }
      .title { font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; }
      .sub { font-family: system-ui, sans-serif; font-size: 8px; }
      .bars { fill: none; stroke: #7C3AED; opacity: 0.035; stroke-width: 0.75; }
    </style>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="140" fill="#0A0A0F"/>

  <!-- Waveform amplitude envelopes (3 overlapping sine sweeps) -->
  <path class="bars" d="M0,70 Q200,20 400,70 T800,70 T1200,70"/>
  <path class="bars" d="M0,95 Q250,45 500,95 T1000,95 T1200,95"/>
  <path class="bars" d="M0,45 Q300,10 600,60 T1200,45"/>
  <path class="bars" d="M0,120 Q180,80 360,110 T720,125 T1200,110"/>

  <!-- Frequency spectrum bars — 5 clusters, one per section row -->
  <g fill="#7C3AED" opacity="0.05">
    <!-- Section 1 bars -->
    <rect x="1108" y="6" width="2" height="16"/>
    <rect x="1112" y="4" width="2" height="20"/>
    <rect x="1116" y="8" width="2" height="12"/>
    <rect x="1120" y="2" width="2" height="24"/>
    <rect x="1124" y="5" width="2" height="18"/>
    <rect x="1128" y="7" width="2" height="14"/>
    <rect x="1132" y="3" width="2" height="22"/>

    <!-- Section 2 bars -->
    <rect x="1108" y="34" width="2" height="16"/>
    <rect x="1112" y="30" width="2" height="24"/>
    <rect x="1116" y="36" width="2" height="12"/>
    <rect x="1120" y="32" width="2" height="20"/>
    <rect x="1124" y="35" width="2" height="14"/>
    <rect x="1128" y="38" width="2" height="8"/>
    <rect x="1132" y="31" width="2" height="22"/>

    <!-- Section 3 bars -->
    <rect x="1108" y="62" width="2" height="16"/>
    <rect x="1112" y="58" width="2" height="24"/>
    <rect x="1116" y="64" width="2" height="12"/>
    <rect x="1120" y="60" width="2" height="18"/>
    <rect x="1124" y="57" width="2" height="24"/>
    <rect x="1128" y="63" width="2" height="14"/>
    <rect x="1132" y="61" width="2" height="16"/>

    <!-- Section 4 bars -->
    <rect x="1108" y="90" width="2" height="16"/>
    <rect x="1112" y="86" width="2" height="24"/>
    <rect x="1116" y="92" width="2" height="12"/>
    <rect x="1120" y="88" width="2" height="20"/>
    <rect x="1124" y="95" width="2" height="10"/>
    <rect x="1128" y="87" width="2" height="20"/>
    <rect x="1132" y="91" width="2" height="14"/>

    <!-- Section 5 bars -->
    <rect x="1108" y="118" width="2" height="16"/>
    <rect x="1112" y="114" width="2" height="24"/>
    <rect x="1116" y="120" width="2" height="12"/>
    <rect x="1120" y="116" width="2" height="20"/>
    <rect x="1124" y="122" width="2" height="12"/>
    <rect x="1128" y="115" width="2" height="22"/>
    <rect x="1132" y="119" width="2" height="14"/>
  </g>

  <!-- Section 1 — What It Is -->
  <text x="40" y="17" class="num" fill="#7C3AED" opacity="0.5">01</text>
  <text x="85" y="17" class="title" fill="#F8FAFC">What It Is</text>
  <text x="85" y="25" class="sub" fill="#64748B">Professional AI music creation, delivered inside Telegram</text>
  <line x1="40" y1="28" x2="1160" y2="28" stroke="rgba(124,92,255,0.15)" stroke-width="0.5"/>

  <!-- Section 2 — Why Different -->
  <text x="40" y="45" class="num" fill="#7C3AED" opacity="0.5">02</text>
  <text x="85" y="45" class="title" fill="#F8FAFC">Why Different</text>
  <text x="85" y="53" class="sub" fill="#64748B">Human-AI collaboration with stem separation, mixing, and A/B versioning</text>
  <line x1="40" y1="56" x2="1160" y2="56" stroke="rgba(124,92,255,0.15)" stroke-width="0.5"/>

  <!-- Section 3 — How It Works -->
  <text x="40" y="73" class="num" fill="#7C3AED" opacity="0.5">03</text>
  <text x="85" y="73" class="title" fill="#F8FAFC">How It Works</text>
  <text x="85" y="81" class="sub" fill="#64748B">Describe your vision, generate with Suno AI, refine in the Unified Studio</text>
  <line x1="40" y1="84" x2="1160" y2="84" stroke="rgba(124,92,255,0.15)" stroke-width="0.5"/>

  <!-- Section 4 — Quick Start -->
  <text x="40" y="101" class="num" fill="#7C3AED" opacity="0.5">04</text>
  <text x="85" y="101" class="title" fill="#F8FAFC">Quick Start</text>
  <text x="85" y="109" class="sub" fill="#64748B">Pick a style, generate two variants, compare and share in seconds</text>
  <line x1="40" y1="112" x2="1160" y2="112" stroke="rgba(124,92,255,0.15)" stroke-width="0.5"/>

  <!-- Section 5 — Tech Stack -->
  <text x="40" y="129" class="num" fill="#7C3AED" opacity="0.5">05</text>
  <text x="85" y="129" class="title" fill="#F8FAFC">Tech Stack</text>
  <text x="85" y="137" class="sub" fill="#64748B">React 19, Supabase, Suno AI, Tone.js, Tailwind CSS, TypeScript</text>
</svg>
