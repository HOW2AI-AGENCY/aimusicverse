<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(124, 92, 255, 0.15)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.08)"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="#0A0A0F" rx="16"/>

  <!-- ===== CARD 1: Describe ===== -->
  <g transform="translate(40, 60)">
    <rect width="250" height="190" rx="16" fill="#0F0F1A" stroke="url(#cardStroke)" stroke-width="1"/>
    <!-- Icon area: Telegram-ish paper plane shape -->
    <g transform="translate(125, 44)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.4"/>
      <path d="M-6,-3 L2,0 L-6,3 Z" fill="#7C3AED" opacity="0.7"/>
      <path d="M2,0 L8,-4 L8,4 Z" fill="#7C3AED" opacity="0.5"/>
    </g>
    <text x="125" y="95" text-anchor="middle" fill="#F8FAFC" font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="15" font-weight="600">Describe</text>
    <text x="125" y="118" text-anchor="middle" fill="#64748B" font-family="DM Sans, system-ui, sans-serif" font-size="11">
      <tspan x="125" dy="0">Describe your music idea</tspan>
      <tspan x="125" dy="16">in Telegram with style,</tspan>
      <tspan x="125" dy="16">genre, and mood prompts</tspan>
    </text>
  </g>

  <!-- Arrow 1→2 -->
  <g transform="translate(298, 142)">
    <rect x="0" y="-2" width="34" height="4" rx="2" fill="url(#arrowGrad)"/>
    <polygon points="38,0 32,-5 32,5" fill="#10B981"/>
  </g>

  <!-- ===== CARD 2: Generate ===== -->
  <g transform="translate(340, 60)">
    <rect width="250" height="190" rx="16" fill="#0F0F1A" stroke="url(#cardStroke)" stroke-width="1"/>
    <!-- Icon: sound wave circles -->
    <g transform="translate(125, 44)">
      <circle cx="0" cy="0" r="6" fill="#10B981" opacity="0.8"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#10B981" stroke-width="1.2" opacity="0.4"/>
      <circle cx="0" cy="0" r="22" fill="none" stroke="#10B981" stroke-width="0.8" opacity="0.2"/>
    </g>
    <text x="125" y="95" text-anchor="middle" fill="#F8FAFC" font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="15" font-weight="600">Generate</text>
    <text x="125" y="118" text-anchor="middle" fill="#64748B" font-family="DM Sans, system-ui, sans-serif" font-size="11">
      <tspan x="125" dy="0">Suno AI generates</tspan>
      <tspan x="125" dy="16">2 versions (A/B) from</tspan>
      <tspan x="125" dy="16">your description</tspan>
    </text>
    <!-- A/B badge -->
    <g transform="translate(86, 170)">
      <rect x="0" y="0" width="18" height="14" rx="3" fill="#7C3AED" opacity="0.15"/>
      <text x="9" y="10" text-anchor="middle" fill="#7C3AED" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600">A</text>
    </g>
    <g transform="translate(148, 170)">
      <rect x="0" y="0" width="18" height="14" rx="3" fill="#10B981" opacity="0.15"/>
      <text x="9" y="10" text-anchor="middle" fill="#10B981" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600">B</text>
    </g>
  </g>

  <!-- Arrow 2→3 -->
  <g transform="translate(598, 142)">
    <rect x="0" y="-2" width="34" height="4" rx="2" fill="url(#arrowGrad)"/>
    <polygon points="38,0 32,-5 32,5" fill="#10B981"/>
  </g>

  <!-- ===== CARD 3: Edit &amp; Mix ===== -->
  <g transform="translate(640, 60)">
    <rect width="250" height="190" rx="16" fill="#0F0F1A" stroke="url(#cardStroke)" stroke-width="1"/>
    <!-- Icon: waveform bars -->
    <g transform="translate(125, 44)">
      <rect x="-18" y="-16" width="4" height="20" rx="1" fill="#7C3AED" opacity="0.5"/>
      <rect x="-11" y="-10" width="4" height="14" rx="1" fill="#7C3AED" opacity="0.6"/>
      <rect x="-4" y="-20" width="4" height="24" rx="1" fill="#10B981" opacity="0.7"/>
      <rect x="3" y="-14" width="4" height="18" rx="1" fill="#7C3AED" opacity="0.5"/>
      <rect x="10" y="-8" width="4" height="12" rx="1" fill="#7C3AED" opacity="0.4"/>
      <rect x="17" y="-18" width="4" height="22" rx="1" fill="#10B981" opacity="0.6"/>
    </g>
    <text x="125" y="95" text-anchor="middle" fill="#F8FAFC" font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="15" font-weight="600">Edit &amp; Mix</text>
    <text x="125" y="118" text-anchor="middle" fill="#64748B" font-family="DM Sans, system-ui, sans-serif" font-size="11">
      <tspan x="125" dy="0">Stem separation, MIDI</tspan>
      <tspan x="125" dy="16">transcription, mixing</tspan>
      <tspan x="125" dy="16">tools and waveform editor</tspan>
    </text>
    <!-- Mini tags -->
    <g transform="translate(56, 172)">
      <rect x="0" y="0" width="36" height="12" rx="4" fill="#7C3AED" opacity="0.1"/>
      <text x="18" y="9" text-anchor="middle" fill="#7C3AED" font-family="DM Sans, sans-serif" font-size="8">STEMS</text>
    </g>
    <g transform="translate(100, 172)">
      <rect x="0" y="0" width="36" height="12" rx="4" fill="#10B981" opacity="0.1"/>
      <text x="18" y="9" text-anchor="middle" fill="#10B981" font-family="DM Sans, sans-serif" font-size="8">MIDI</text>
    </g>
    <g transform="translate(144, 172)">
      <rect x="0" y="0" width="36" height="12" rx="4" fill="#7C3AED" opacity="0.1"/>
      <text x="18" y="9" text-anchor="middle" fill="#64748B" font-family="DM Sans, sans-serif" font-size="8">MIX</text>
    </g>
  </g>

  <!-- Arrow 3→4 -->
  <g transform="translate(898, 142)">
    <rect x="0" y="-2" width="34" height="4" rx="2" fill="url(#arrowGrad)"/>
    <polygon points="38,0 32,-5 32,5" fill="#10B981"/>
  </g>

  <!-- ===== CARD 4: Share ===== -->
  <g transform="translate(940, 60)">
    <rect width="220" height="190" rx="16" fill="#0F0F1A" stroke="url(#cardStroke)" stroke-width="1"/>
    <!-- Icon: share/export diamond -->
    <g transform="translate(110, 44)">
      <path d="M0,-16 L16,0 L0,16 L-16,0 Z" fill="none" stroke="#10B981" stroke-width="1.2" opacity="0.3"/>
      <path d="M0,-10 L10,0 L0,10 L-10,0 Z" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="1"/>
      <!-- Arrow up-right from center -->
      <line x1="4" y1="-4" x2="12" y2="-12" stroke="#10B981" stroke-width="1.2" opacity="0.6"/>
      <polygon points="14,-14 10,-12 12,-9" fill="#10B981" opacity="0.6"/>
    </g>
    <text x="110" y="95" text-anchor="middle" fill="#F8FAFC" font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="15" font-weight="600">Share</text>
    <text x="110" y="118" text-anchor="middle" fill="#64748B" font-family="DM Sans, system-ui, sans-serif" font-size="11">
      <tspan x="110" dy="0">Publish to Telegram,</tspan>
      <tspan x="110" dy="16">share with community</tspan>
      <tspan x="110" dy="16">or export your track</tspan>
    </text>
  </g>

  <!-- ===== Waveform Motif (bottom) ===== -->
  <g transform="translate(40, 330)">
    <rect x="0" y="0" width="1120" height="1" fill="url(#arrowGrad)" opacity="0.15"/>
    <!-- Stylized waveform bars -->
    <g opacity="0.25">
      <rect x="0"   y="-24" width="4" height="28" rx="1" fill="#7C3AED"/>
      <rect x="10"  y="-18" width="4" height="22" rx="1" fill="#7C3AED"/>
      <rect x="20"  y="-28" width="4" height="32" rx="1" fill="#7C3AED"/>
      <rect x="30"  y="-34" width="4" height="38" rx="1" fill="#7C3AED"/>
      <rect x="40"  y="-40" width="4" height="44" rx="1" fill="#10B981"/>
      <rect x="50"  y="-36" width="4" height="40" rx="1" fill="#10B981"/>
      <rect x="60"  y="-44" width="4" height="48" rx="1" fill="#10B981"/>
      <rect x="70"  y="-38" width="4" height="42" rx="1" fill="#10B981"/>
      <rect x="80"  y="-30" width="4" height="34" rx="1" fill="#7C3AED"/>
      <rect x="90"  y="-26" width="4" height="30" rx="1" fill="#7C3AED"/>
      <rect x="100" y="-20" width="4" height="24" rx="1" fill="#7C3AED"/>
      <rect x="110" y="-16" width="4" height="20" rx="1" fill="#7C3AED"/>
    </g>
    <text x="560" y="14" text-anchor="middle" fill="#64748B" font-family="DM Sans, system-ui, sans-serif" font-size="10" opacity="0.5">AI-POWERED MUSIC CREATION FLOW</text>
  </g>

  <!-- Decorative dots between cards -->
  <circle cx="315" cy="130" r="2" fill="#7C3AED" opacity="0.3"/>
  <circle cx="615" cy="130" r="2" fill="#10B981" opacity="0.3"/>
  <circle cx="915" cy="130" r="2" fill="#7C3AED" opacity="0.3"/>
</svg>
