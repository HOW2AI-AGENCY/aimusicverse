<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <!-- bg -->
  <rect width="1200" height="600" fill="oklch(14.5% 0.012 265)" rx="12"/>

  <!-- subtle grid -->
  <g opacity="0.04" stroke="oklch(65% 0.01 265)" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="600"/>
  </g>

  <!-- title -->
  <text x="60" y="50" font-family="Oswald, sans-serif" font-size="13" fill="oklch(55% 0.015 265)" letter-spacing="2.5">
    FIG. 01 — LYRICS STUDIO · AI HARNESS ARCHITECTURE
  </text>

  <!-- Layer 1: UI Tools (left column) -->
  <g transform="translate(50, 90)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="10" fill="oklch(55% 0.015 265)">// LAYER 1 — UI</text>

    <rect x="0" y="20" width="160" height="44" rx="8" fill="oklch(22% 0.02 265)" stroke="oklch(35% 0.02 265)" stroke-width="1"/>
    <text x="14" y="42" font-family="Golos Text, sans-serif" font-size="13" fill="oklch(88% 0.01 265)">✏️ Написать</text>
    <text x="130" y="54" font-family="JetBrains Mono, monospace" font-size="8" fill="oklch(50% 0.01 265)">write</text>

    <rect x="0" y="74" width="160" height="44" rx="8" fill="oklch(22% 0.02 265)" stroke="oklch(35% 0.02 265)" stroke-width="1"/>
    <text x="14" y="96" font-family="Golos Text, sans-serif" font-size="13" fill="oklch(88% 0.01 265)">📊 Анализ</text>
    <text x="120" y="108" font-family="JetBrains Mono, monospace" font-size="8" fill="oklch(50% 0.01 265)">analyze</text>

    <rect x="0" y="128" width="160" height="44" rx="8" fill="oklch(22% 0.02 265)" stroke="oklch(35% 0.02 265)" stroke-width="1"/>
    <text x="14" y="150" font-family="Golos Text, sans-serif" font-size="13" fill="oklch(88% 0.01 265)">🎧 Продюсер</text>
    <text x="118" y="162" font-family="JetBrains Mono, monospace" font-size="8" fill="oklch(50% 0.01 265)">producer</text>

    <rect x="0" y="182" width="160" height="44" rx="8" fill="oklch(22% 0.02 265)" stroke="oklch(35% 0.02 265)" stroke-width="1"/>
    <text x="14" y="204" font-family="Golos Text, sans-serif" font-size="13" fill="oklch(88% 0.01 265)">⚡ Suno</text>
    <text x="120" y="216" font-family="JetBrains Mono, monospace" font-size="8" fill="oklch(50% 0.01 265)">optimize</text>

    <rect x="0" y="236" width="160" height="44" rx="8" fill="oklch(22% 0.02 265)" stroke="oklch(35% 0.02 265)" stroke-width="1"/>
    <text x="14" y="258" font-family="Golos Text, sans-serif" font-size="13" fill="oklch(88% 0.01 265)">🌐 Перевод</text>
    <text x="122" y="270" font-family="JetBrains Mono, monospace" font-size="8" fill="oklch(50% 0.01 265)">translate</text>
  </g>

  <!-- Arrow: UI → Context -->
  <g stroke="oklch(88% 0.19 128)" stroke-width="2" opacity="0.6">
    <line x1="215" y1="200" x2="340" y2="200" stroke-dasharray="4 4"/>
    <polygon points="340,200 332,195 332,205" fill="oklch(88% 0.19 128)" opacity="0.8"/>
  </g>
  <text x="245" y="192" font-family="JetBrains Mono, monospace" font-size="8" fill="oklch(50% 0.015 140)">action + context</text>

  <!-- Layer 2: Context Assembly (center) -->
  <g transform="translate(345, 90)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="10" fill="oklch(55% 0.015 265)">// LAYER 2 — CONTEXT</text>

    <rect x="0" y="20" width="280" height="340" rx="12" fill="oklch(18% 0.01 265)" stroke="oklch(30% 0.015 265)" stroke-width="1"/>

    <text x="140" y="48" text-anchor="middle" font-family="Oswald, sans-serif" font-size="14" fill="oklch(88% 0.19 128)" letter-spacing="1">CONTEXT BUILDER</text>

    <!-- context items -->
    <g font-family="JetBrains Mono, monospace" font-size="11" fill="oklch(75% 0.01 265)">
      <text x="20" y="80">lyrics: "Текущий текст песни..."</text>
      <text x="20" y="105">section: { type: "chorus", ... }</text>
      <text x="20" y="130">tags: ["808 Bass", "Male Vocal"]</text>
      <text x="20" y="155">notes: "Бридж: смена темпа"</text>
      <text x="20" y="180">style: "dark synth, 140 BPM"</text>
      <text x="20" y="205">project: { genre, mood, ... }</text>
      <text x="20" y="230">track: { position: 3/12 }</text>
      <text x="20" y="255">tracklist: [ 12 tracks ]</text>
      <text x="20" y="280">history: [ last 6 msgs ]</text>
    </g>

    <rect x="20" y="295" width="240" height="48" rx="6" fill="oklch(16% 0.01 140)" stroke="oklch(30% 0.02 140)" stroke-width="1"/>
    <text x="140" y="315" text-anchor="middle" font-family="Golos Text, sans-serif" font-size="11" fill="oklch(65% 0.015 140)">Prompt Registry</text>
    <text x="140" y="332" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="oklch(55% 0.01 140)">action → system + user prompt</text>
  </g>

  <!-- Arrow: Context → Gateway -->
  <g stroke="oklch(88% 0.19 128)" stroke-width="2" opacity="0.6">
    <line x1="630" y1="260" x2="740" y2="260" stroke-dasharray="4 4"/>
    <polygon points="740,260 732,255 732,265" fill="oklch(88% 0.19 128)" opacity="0.8"/>
  </g>
  <text x="650" y="252" font-family="JetBrains Mono, monospace" font-size="8" fill="oklch(50% 0.015 140)">SSE stream</text>

  <!-- Layer 3: Edge Function + LLM (right) -->
  <g transform="translate(745, 90)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="10" fill="oklch(55% 0.015 265)">// LAYER 3 — EDGE FUNCTION</text>

    <rect x="0" y="20" width="180" height="70" rx="8" fill="oklch(20% 0.015 265)" stroke="oklch(35% 0.02 265)" stroke-width="1"/>
    <text x="90" y="44" text-anchor="middle" font-family="Oswald, sans-serif" font-size="13" fill="oklch(82% 0.01 265)">Supabase Edge</text>
    <text x="90" y="62" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="oklch(55% 0.01 265)">auth · CORS · SSE</text>
    <text x="90" y="78" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="oklch(55% 0.01 265)">parser · metadata</text>

    <!-- arrow down -->
    <line x1="90" y1="95" x2="90" y2="120" stroke="oklch(45% 0.01 265)" stroke-width="1.5"/>
    <polygon points="90,120 86,112 94,112" fill="oklch(45% 0.01 265)"/>

    <rect x="0" y="125" width="180" height="70" rx="8" fill="oklch(16% 0.02 140)" stroke="oklch(30% 0.025 140)" stroke-width="1"/>
    <text x="90" y="149" text-anchor="middle" font-family="Oswald, sans-serif" font-size="13" fill="oklch(78% 0.15 140)">AI Gateway</text>
    <text x="90" y="167" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="oklch(55% 0.01 140)">Lovable proxy</text>
    <text x="90" y="183" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="oklch(55% 0.01 140)">retry · fallback</text>

    <!-- arrow down -->
    <line x1="90" y1="200" x2="90" y2="225" stroke="oklch(45% 0.01 265)" stroke-width="1.5"/>
    <polygon points="90,225 86,217 94,217" fill="oklch(45% 0.01 265)"/>

    <rect x="0" y="230" width="180" height="70" rx="8" fill="oklch(22% 0.03 290)" stroke="oklch(40% 0.04 290)" stroke-width="1"/>
    <text x="90" y="254" text-anchor="middle" font-family="Oswald, sans-serif" font-size="14" fill="oklch(72% 0.08 290)">Gemini 2.5 Flash</text>
    <text x="90" y="272" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="oklch(55% 0.01 290)">google/gemini-2.5-flash</text>
    <text x="90" y="288" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="oklch(55% 0.01 290)">max 2500 tokens</text>
  </g>

  <!-- Return arrow: Result → UI -->
  <g stroke="oklch(88% 0.19 200)" stroke-width="2" opacity="0.5">
    <path d="M 835 370 Q 835 480, 600 480 L 130 480 Q 130 480, 130 370" fill="none" stroke-dasharray="3 6"/>
    <polygon points="130,370 126,378 134,378" fill="oklch(88% 0.19 200)" opacity="0.8"/>
  </g>
  <text x="400" y="500" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="oklch(50% 0.01 200)">
    structured JSON → parse → result cards → apply lyrics/title/style
  </text>

  <!-- Bottom labels -->
  <text x="60" y="550" font-family="JetBrains Mono, monospace" font-size="9" fill="oklch(45% 0.01 265)">
    React 19 · TypeScript · Vite
  </text>
  <text x="390" y="550" font-family="JetBrains Mono, monospace" font-size="9" fill="oklch(45% 0.01 265)">
    Supabase Deno Edge Functions
  </text>
  <text x="760" y="550" font-family="JetBrains Mono, monospace" font-size="9" fill="oklch(45% 0.01 265)">
    Suno API · Lovable AI Gateway
  </text>
</svg>
