name: Update README badges

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'bun.lock'
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tag history for `git describe --tags`

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate badges
        run: node scripts/update-badges.mjs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs(readme): auto-update version badges'
          title: 'docs(readme): auto-update version badges'
          body: |
            Automated badge refresh from `package.json` / latest release tag.

            Generated by `.github/workflows/update-badges.yml`.
          branch: chore/auto-update-badges
          delete-branch: true
          add-paths: |
            README.md
