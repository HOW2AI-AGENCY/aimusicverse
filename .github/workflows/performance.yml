name: Performance Monitoring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for trend analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: dist/
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: npm ci

      - name: Build with analysis
        run: npm run build
        env:
          ANALYZE: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

      - name: Calculate bundle size
        id: bundle
        run: |
          SIZE=$(du -sk dist/assets/*.js | awk '{sum+=$1} END {print sum}')
          echo "js_size=${SIZE}" >> $GITHUB_OUTPUT
          echo "Bundle JS size: ${SIZE}KB"

      - name: Run bundle tracking
        id: tracking
        run: npm run size:track
        continue-on-error: true

      - name: Run size-limit
        id: size-limit
        run: npm run size

      - name: Check bundle size threshold
        id: threshold
        run: |
          # Threshold: 950KB (Constitution compliance)
          SIZE=${{ steps.bundle.outputs.js_size }}
          if [ "$SIZE" -gt 950 ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "⚠️ Bundle size (${SIZE}KB) exceeds limit (950KB)"
            echo "::error::Bundle size exceeded - limit is 950KB, current: ${SIZE}KB"
            exit 1
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Bundle size (${SIZE}KB) within limit (950KB)"
          fi

      - name: Comment PR with bundle size trend
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const size = '${{ steps.bundle.outputs.js_size }}';
            const status = '${{ steps.threshold.outputs.status }}';
            const emoji = status === 'success' ? '✅' : '❌';

            const comment = `## Bundle Size Report

            ${emoji} **Total Bundle Size**: ${size}KB / 950KB

            **Status**: ${status === 'success' ? 'Within limits' : 'Exceeds limits'}

            Generated by commit: ${{ github.sha }}

            <!-- bundle-comment-marker -->`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.body.includes('bundle-comment-marker') &&
              comment.user.type === 'Bot'
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: Upload bundle report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: |
            dist/stats.html
            .bundle-size-results.json
            .bundle-size-history.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload bundle size results
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-results
          path: .bundle-size-results.json
          if-no-files-found: ignore
          retention-days: 30
