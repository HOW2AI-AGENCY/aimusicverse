name: Quality & Build

on:
  push:
  pull_request:
    # Gate merges on every PR (not only PRs targeting main).
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / TypeCheck / Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Lint
        run: pnpm lint

      - name: Swipe-hint guard
        run: node scripts/check-no-swipe-hints.mjs

      - name: TypeScript check (npm)
        run: pnpm typecheck
        env:
          CI: true

      - name: TypeScript check (bun)
        run: bun run typecheck
        env:
          CI: true

      - name: Unit tests
        run: pnpm test

  build:
    name: Build & Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-build type check
        run: pnpm typecheck:app
        env:
          CI: true

      - name: Validate CSS @import order
        run: pnpm check:css-imports

      - name: Validate Section design tokens
        run: pnpm check:section-tokens

      - name: Build
        run: pnpm build

      - name: Bundle size check
        run: pnpm size

  visual-home:
    name: Visual Regression (Home)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Home visual regression
        run: pnpm test:visual:home
        env:
          CI: true

      - name: Run responsive audit (320-420px + 768px+)
        run: pnpm test:responsive
        env:
          CI: true

      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-home-diffs
          path: |
            playwright-visual-report
            test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
