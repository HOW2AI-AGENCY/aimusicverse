name: Docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: Markdown lint & link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !node_modules
            !docs/archive/**
            !**/CHANGELOG.md
        continue-on-error: true

      - name: Check links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --verbose
            --max-concurrency 8
            --exclude-path docs/archive
            --exclude-path node_modules
            --exclude-path graphify-out
            --exclude-path .claude
            --exclude-path prd
            --exclude-path specs
            --exclude-path plans
            --exclude-path SPRINTS/completed
            --exclude '^https?://localhost'
            --exclude '^https?://127\.0\.0\.1'
            --exclude '^https?://t\.me/'
            --exclude 'lovable\.app'
            --exclude 'how2ai\.agency'
            --exclude 'klang\.io'
            --exclude 'musicverse\.ai'
            --exclude 'higgsfield\.ai'
            --exclude 'github\.com/.*/rules/'
            --accept 200,206,429
            './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-site:
    name: Build docs site (MkDocs)
    runs-on: ubuntu-latest
    needs: link-check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r docs/requirements.txt

      - name: Build site
        # NOTE: not --strict. docs_dir is the repo root (see mkdocs.yml), so the
        # tree contains hundreds of markdown files with code-reference links to
        # src/** and other non-page files. Under --strict every such link and
        # every page-not-in-nav is a fatal warning, which is not achievable
        # without restructuring docs_dir. Link integrity is enforced separately
        # by the lychee link-check job above.
        run: mkdocs build

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
