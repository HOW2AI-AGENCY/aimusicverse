name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint check
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: TypeScript Type Check
        run: npm run typecheck
        env:
          CI: true
        # Fails the build if any TypeScript errors are found.
        # Uses tsc --build --force to check all referenced projects (app + node).
        # To suppress pre-existing errors temporarily, see docs/QUALITY_GATES.md

      - name: Unit tests
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  build:
    name: Build & Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Pre-build type check
        run: npm run typecheck:app
        # Guard: fail fast if TypeScript errors exist before bundling.
        # This catches type errors that vite build might skip.

      - name: Validate CSS @import order (src/index.css)
        run: npm run check:css-imports

      - name: Validate Section design tokens (no saturated brand washes)
        run: npm run check:section-tokens
        # Mirror of the ESLint hard-block on src/components/layout/Section.tsx.
        # Fails CI loudly with path:line + a suggested replacement.

      - name: Vite build (full log)
        id: vite_build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee vite-build.log
        # Capture the FULL stdout+stderr of `vite build` so PR reviewers
        # see every warning/error without re-running locally.

      - name: Fail on circular chunk warnings
        run: |
          if grep -i "Circular chunk:" vite-build.log; then
            echo "❌ Circular chunk warnings detected. This causes TDZ crashes in production."
            echo "Merge interdependent manualChunks or remove the catch-all vendor-other."
            exit 1
          fi
        # Hard-block future TDZ regressions. Rollup circular chunks happen when
        # manualChunks split modules that import each other.

      - name: Upload Vite build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vite-build-log
          path: vite-build.log

      - name: SEO check (meta / canonical / OG / sitemap / robots)
        run: npm run seo:check

      - name: Check bundle size
        run: npm run size

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/

  e2e:
    name: E2E Tests (Desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run desktop E2E tests
        run: npm run test:e2e:chromium
        env:
          CI: true

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-desktop
          path: playwright-report/

      - name: Upload smoke artifacts (boot log + stack traces)
        # Persists musicverse_boot_log + early errors + console/page errors
        # captured by tests/e2e/smoke.app-boots.spec.ts. Click the artifact
        # in the PR to see exactly why the app failed to boot.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-boot-log
          path: test-results/smoke/

  e2e-mobile:
    # Dedicated mobile-emulation pass for z-index / hotkey / portal regressions.
    # Scoped to the focused specs so per-PR feedback stays fast.
    name: E2E Tests (Mobile emulation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers (chromium + webkit)
        run: npx playwright install --with-deps chromium webkit

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run mobile E2E (z-index, portal, hotkey, IME, taps)
        env:
          CI: true
        run: |
          npx playwright test \
            tests/e2e/dev-overlay.hotkey.spec.ts \
            tests/e2e/dev-overlay.ime.spec.ts \
            tests/e2e/dev-overlay.telegram-web.spec.ts \
            tests/e2e/dev-overlay.force-visible.spec.ts \
            tests/e2e/generation.dialog-portal.spec.ts \
            tests/e2e/generation.dialog-zindex.spec.ts \
            tests/e2e/generation.dialog-orientation.spec.ts \
            tests/e2e/generation.mobile-taps.spec.ts \
            --project="Mobile Chrome" \
            --project="Mobile Safari" \
            --retries=2

      - name: Upload mobile E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-mobile
          path: playwright-report/

  smoke:
    # Browser-matrix smoke that catches "white screen" regressions across
    # engines. Runs the dedicated smoke spec which boots the real router,
    # asserts no #error-display, and dumps boot log + stacktraces to
    # test-results/smoke/<browser>/ for the PR comment to link to.
    name: Smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run smoke spec — ${{ matrix.browser }}
        env:
          CI: true
        run: |
          set -o pipefail
          npx playwright test tests/e2e/smoke.app-boots.spec.ts \
            --project=${{ matrix.browser }} \
            --reporter=list,html,json 2>&1 | tee smoke-${{ matrix.browser }}.log

      - name: Upload smoke artifacts — ${{ matrix.browser }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.browser }}
          path: |
            test-results/smoke/${{ matrix.browser }}/
            smoke-${{ matrix.browser }}.log
            playwright-report/

  pr-comment:
    # Posts a sticky PR comment summarising css-imports + smoke matrix
    # with a one-click link to the artifacts (boot log + stacktraces).
    # Runs even when previous jobs fail so failures are surfaced loudly.
    name: PR summary comment
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [quality, build, smoke]
    permissions:
      pull-requests: write
      actions: read
      contents: read

    steps:
      - name: Compose & post sticky comment
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const need = ${{ toJSON(needs) }};

            const status = (r) => {
              if (!r) return '⚪ skipped';
              if (r.result === 'success') return '✅ pass';
              if (r.result === 'skipped') return '⚪ skipped';
              if (r.result === 'cancelled') return '⚪ cancelled';
              return '❌ fail';
            };

            const cssImports = status(need.quality);          // includes lint/typecheck/test; css-imports runs in build's prebuild
            const buildJob   = status(need.build);             // includes "Validate CSS @import order" + vite-build.log
            const smokeJob   = status(need.smoke);             // matrix smoke

            const lines = [
              '## 🤖 CI summary',
              '',
              '| Check | Status | What it covers |',
              '| --- | --- | --- |',
              `| CSS \`@import\` order + Section tokens + Vite build | ${buildJob} | \`check:css-imports\` + \`check:section-tokens\` (no saturated brand washes in Section) + full \`vite build\` log |`,
              `| Quality (lint / typecheck / unit) | ${cssImports} | ESLint (incl. Section brand-wash hard-block), TypeScript, Vitest |`,
              `| Smoke (chromium · firefox · webkit) | ${smokeJob} | App boots, router renders, no \`#error-display\`, retain-on-failure trace + video |`,
              '',
              '### 📎 Artifacts — open this run to download',
              '',
              `- 🔎 [**All artifacts for this run**](${runUrl}#artifacts)`,
              `- 📄 \`vite-build-log\` — full \`vite build\` stdout/stderr`,
              `- 🧪 \`smoke-chromium\` — boot-log.json · early-errors.json · console/page-errors.log · failed-requests.log · dom-map.json · route screenshots · trace.zip · video.webm`,
              `- 🧪 \`smoke-firefox\` — same per-browser bundle (Firefox)`,
              `- 🧪 \`smoke-webkit\` — same per-browser bundle (WebKit)`,
              `- 🎭 \`playwright-report-desktop\` / \`playwright-report-mobile\` — HTML reports`,
              '',
              '### 🛟 If smoke failed',
              '',
              '1. Open the matching `smoke-<browser>` artifact above.',
              '2. Inspect `boot-log.json` + `failed-requests.log` first — they explain 90% of failures.',
              '3. Reproduce locally with the same trace/video:',
              '   ```',
              '   npm run e2e:smoke:rerun        # parallel matrix, auto-reruns only the failed browser',
              '   npm run test:visual            # visual regression for Section + cards',
              '   ```',
              '',
              `<sub>Run: [\`${context.runId}\`](${runUrl}) · commit \`${context.sha.substring(0,7)}\`</sub>`,
            ];
            const body = lines.join('\n');
            const marker = '<!-- ci-summary-comment -->';
            const full = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: full,
              });
            }
