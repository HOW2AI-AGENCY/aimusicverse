name: CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Quality Check
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Lint check
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Type check
              run: npm run typecheck

            - name: Unit tests
              run: npm run test:coverage

            - name: Upload coverage
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: coverage
                  path: coverage/

    build:
        name: Build & Size Check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: quality

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Check bundle size
              run: npm run size

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: dist
                  path: dist/

    e2e:
        name: E2E Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: build

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Build
              run: npm run build

            - name: Run E2E tests
              run: npm run test:e2e:chromium
              env:
                  CI: true

            - name: Upload E2E report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
