name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: TypeScript Type Check
        run: npm run typecheck
        env:
          CI: true
        # Fails the build if any TypeScript errors are found.
        # Uses tsc --build --force to check all referenced projects (app + node).
        # To suppress pre-existing errors temporarily, see docs/QUALITY_GATES.md

      - name: Unit tests
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  build:
    name: Build & Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pre-build type check
        run: npm run typecheck:app
        # Guard: fail fast if TypeScript errors exist before bundling.
        # This catches type errors that vite build might skip.

      - name: Build
        run: npm run build

      - name: SEO check (meta / canonical / OG / sitemap / robots)
        run: npm run seo:check

      - name: Check bundle size
        run: npm run size

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/

  e2e:
    name: E2E Tests (Desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run desktop E2E tests
        run: npm run test:e2e:chromium
        env:
          CI: true

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-desktop
          path: playwright-report/

  e2e-mobile:
    # Dedicated mobile-emulation pass for z-index / hotkey / portal regressions.
    # Scoped to the focused specs so per-PR feedback stays fast.
    name: E2E Tests (Mobile emulation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium + webkit)
        run: npx playwright install --with-deps chromium webkit

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run mobile E2E (z-index, portal, hotkey, IME, taps)
        env:
          CI: true
        run: |
          npx playwright test \
            tests/e2e/dev-overlay.hotkey.spec.ts \
            tests/e2e/dev-overlay.ime.spec.ts \
            tests/e2e/dev-overlay.telegram-web.spec.ts \
            tests/e2e/generation.dialog-portal.spec.ts \
            tests/e2e/generation.dialog-zindex.spec.ts \
            tests/e2e/generation.mobile-taps.spec.ts \
            --project="Mobile Chrome" \
            --project="Mobile Safari" \
            --retries=2

      - name: Upload mobile E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-mobile
          path: playwright-report/

