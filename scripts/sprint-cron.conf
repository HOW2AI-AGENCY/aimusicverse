# MusicVerse AI - Sprint Monitoring Cron Configuration
# Version: 1.0.0
# Last Updated: 2026-06-26
#
# Installation:
#   crontab -e
#   Paste this content
#
# Or use: ./scripts/update-sprint-status.sh --install

# Environment variables
SHELL=/bin/bash
PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin

# MusicVerse AI Sprint Monitoring
# Project directory
MUSICVERSE_HOME=/d/.MUSICVERSE/aimusicverse

# Daily sprint status update at 11 PM UTC
0 23 * * * cd $MUSICVERSE_HOME && bash scripts/update-sprint-status.sh --daily >> .sprint-cron.log 2>&1

# Weekly comprehensive update on Monday at 9 AM UTC
0 9 * * 1 cd $MUSICVERSE_HOME && bash scripts/update-sprint-status.sh --weekly >> .sprint-cron-weekly.log 2>&1

# GitHub sync every 6 hours
0 */6 * * * cd $MUSICVERSE_HOME && bash scripts/update-sprint-status.sh --github-sync >> .sprint-github-sync.log 2>&1

# Health check daily at 8 AM UTC
0 8 * * * cd $MUSICVERSE_HOME && bash scripts/update-sprint-status.sh --health-check >> .sprint-health.log 2>&1

# Backup sprint reports weekly on Sunday at 10 PM UTC
0 22 * * 0 cd $MUSICVERSE_HOME && tar -czf sprint-reports-backup-$(date +\%Y\%m\%d).tar.gz SPRINTS/reports/

# Clean old logs monthly on 1st at midnight
0 0 1 * * cd $MUSICVERSE_HOME && find . -name "*.log" -mtime +30 -delete && find SPRINTS/reports -name "*.txt" -mtime +90 -delete
